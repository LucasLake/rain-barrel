# Regenton (rain barrel) ESPHome firmware
#
# Requires in secrets.yaml (see secrets.yaml.example): wifi_ssid,
# wifi_password, ota_password.
#
# `use_address` (a fixed IP for faster OTA uploads) has been removed
# from this version because it's site-specific — add it back yourself
# if you want a fixed IP for your Regenton board.

esphome:
  name: regenton
  friendly_name: Regenton

esp32:
  board: esp32dev

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:

ota:
  - platform: esphome
    password: !secret ota_password

logger:

sensor:
  # Enclosure temperature (ESP32-internal sensor, no extra hardware
  # needed). Used both locally to drive the fan (see the interval
  # below) and in Home Assistant to send an "too hot" notification
  # (see ../automations.yaml).
  - platform: internal_temperature
    name: "ESP32 Temperature"
    id: internal_temperature_sensor
    update_interval: 30s

  # Pulse-based water flow sensor on GPIO13. The multiply filter
  # (0.00225) is calibrated for ~444 pulses per litre for the sensor
  # used here — adjust this to match the calibration of your own
  # sensor.
  - platform: pulse_counter
    pin: GPIO13
    name: "Water Flow"
    unit_of_measurement: "L/min"
    update_interval: 1s
    filters:
      - multiply: 0.00225

binary_sensor:
  # Float switch on GPIO5. INPUT_PULLUP + inverted because the switch
  # closes against GND; delayed_on/off of 2s suppresses chatter while
  # the water level hovers around the threshold.
  - platform: gpio
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
    name: "Float Switch"
    device_class: moisture
    filters:
      - delayed_on: 2s
      - delayed_off: 2s

switch:
  # Relays for the pump (GPIO21) and the solenoid valve (GPIO19).
  # inverted: true because these are relay modules that trigger
  # active-low (GPIO low = relay on). The solenoid valve is normally
  # open: it only closes once it receives power (see the explanation
  # in ../automations.yaml under "Regenton keep pump and valve in
  # sync").
  - platform: gpio
    pin:
      number: GPIO21
      inverted: true
    name: "Pump"
    id: pump

  - platform: gpio
    pin:
      number: GPIO19
      inverted: true
    name: "Solenoid Valve"
    id: solenoid_valve

fan:
  - platform: speed
    output: fan_output
    name: "Fan"
    id: fan_

output:
  - platform: ledc
    pin: GPIO23
    id: fan_output
    frequency: 25000 Hz

# Local cooling control, independent of Home Assistant: check the
# enclosure temperature every 2 minutes and turn the fan on/off based
# on a 65°C threshold. Home Assistant only gets a notification about
# this via the "Regenton too hot" automation, but the cooling itself
# keeps working even if HA is offline.
interval:
  - interval: 120s
    then:
      - if:
          condition:
            sensor.in_range:
              id: internal_temperature_sensor
              above: 65
          then:
            - fan.turn_on: fan_
          else:
            - fan.turn_off: fan_
