# Regenton ESPHome-firmware
#
# Vereist in secrets.yaml (zie secrets.yaml.example): wifi_ssid,
# wifi_password, ota_password.
#
# `use_address` (een vast IP voor snellere OTA-uploads) is uit deze
# versie gehaald omdat dat site-specifiek is — zet 'm zelf terug als je
# een vast IP voor je Regenton-board wilt.

esphome:
  name: regenton
  friendly_name: Regenton

esp32:
  board: esp32dev

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:

ota:
  - platform: esphome
    password: !secret ota_password

logger:

sensor:
  # Behuizingstemperatuur (ESP32-interne sensor, geen extra hardware nodig).
  # Wordt zowel lokaal gebruikt om de ventilator aan te sturen (zie
  # interval hieronder) als in Home Assistant om een "te warm"-melding
  # te geven (zie ../automations.yaml).
  - platform: internal_temperature
    name: "ESP32 temperatuur"
    id: internal_temperature_sensor
    update_interval: 30s

  # Pulse-based waterflow-sensor op GPIO13. De multiply-filter (0.00225)
  # is gekalibreerd op ~444 pulsen per liter voor de sensor die hier
  # gebruikt is — pas dit aan op de kalibratie van jouw eigen sensor.
  - platform: pulse_counter
    pin: GPIO13
    name: "Waterflow"
    unit_of_measurement: "L/min"
    update_interval: 1s
    filters:
      - multiply: 0.00225

binary_sensor:
  # Vlotter (float switch) op GPIO5. INPUT_PULLUP + inverted omdat de
  # schakelaar tegen GND schakelt; delayed_on/off van 2s onderdrukt
  # geklots/contactdender terwijl het waterniveau rond de drempel
  # schommelt.
  - platform: gpio
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
    name: "Vlotter"
    device_class: moisture
    filters:
      - delayed_on: 2s
      - delayed_off: 2s

switch:
  # Relais voor de pomp (GPIO21) en het magneetventiel (GPIO19).
  # inverted: true omdat dit relaismodules zijn die actief-laag schakelen
  # (GPIO laag = relais aan). Het magneetventiel is Normally Open: pas
  # als hij stroom krijgt gaat hij dicht (zie de toelichting in
  # ../automations.yaml bij "Regenton pomp en ventiel synchroon houden").
  - platform: gpio
    pin:
      number: GPIO21
      inverted: true
    name: "Pomp"
    id: pomp

  - platform: gpio
    pin:
      number: GPIO19
      inverted: true
    name: "Magneetventiel"
    id: magneetventiel

fan:
  - platform: speed
    output: fan_output
    name: "Ventilator"
    id: ventilator

output:
  - platform: ledc
    pin: GPIO23
    id: fan_output
    frequency: 25000 Hz

# Lokale, van Home Assistant onafhankelijke koeling: elke 2 minuten de
# behuizingstemperatuur checken en de ventilator aan/uit zetten op basis
# van een drempel van 65°C. Home Assistant krijgt via de "Regenton te
# warm"-automation alleen een melding als dit gebeurt, maar de koeling
# zelf blijft ook werken als HA offline is.
interval:
  - interval: 120s
    then:
      - if:
          condition:
            sensor.in_range:
              id: internal_temperature_sensor
              above: 65
          then:
            - fan.turn_on: ventilator
          else:
            - fan.turn_off: ventilator
