# Regenton template sensors
#
# Merge these into an existing `template:` key in your
# configuration.yaml (YAML doesn't allow duplicate top-level keys — if
# you already have a `template:` block, add the `sensor:`/
# `binary_sensor:` items below to that existing block instead of
# pasting this in separately).
#
# The two timestamp sensors reference automation entity IDs
# (automation.regenton_keep_pump_and_valve_in_sync and
# automation.regenton_leak_emergency_stop). Those entity IDs are
# derived by Home Assistant from the automation's `alias` in
# automations.yaml — if you change the alias, the entity ID changes
# too and you'll need to update these references.

template:
  - sensor:
      - name: Regenton Sync Last Run
        device_class: timestamp
        state: >
          {% set ts = state_attr('automation.regenton_keep_pump_and_valve_in_sync', 'last_triggered') %}
          {{ ts.isoformat() if ts else None }}
      - name: Regenton Leak Last Time
        device_class: timestamp
        state: >
          {% set ts = state_attr('automation.regenton_leak_emergency_stop', 'last_triggered') %}
          {{ ts.isoformat() if ts else None }}
  - binary_sensor:
      - name: Regenton Empty
        unique_id: regenton_empty
        device_class: problem
        state: "{{ not is_state('binary_sensor.regenton_float_switch', 'on') }}"
        availability: "{{ has_value('binary_sensor.regenton_float_switch') }}"
        # HA always colors device_class "moisture" (the float switch's
        # own class) red when "on" (= wet = good, in this case). This
        # sensor is the inverse: on = empty = problem = correctly red,
        # off = full = correctly neutral.
