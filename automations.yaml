# Regenton automations
#
# Replace notify.YOUR_NOTIFY_TARGET everywhere with your own notify
# service (e.g. notify.mobile_app_phone). Adjust entity IDs if your
# ESPHome device ended up with different names than
# sensor.regenton_*/switch.regenton_*.

- alias: Regenton
  description: >-
    Core logic: turns on the pump + solenoid valve as soon as downstream
    water flow is detected (something/someone is drawing water) and the
    rain barrel is not empty. Turns everything off again once the flow
    stops, or immediately if the barrel runs dry in the meantime. Sends
    a notification both when the barrel goes empty and when it becomes
    full again.
  triggers:
  - entity_id: sensor.regenton_water_flow
    above: 1
    id: flow_on
    trigger: numeric_state
  - entity_id: sensor.regenton_water_flow
    below: 1
    id: flow_off
    trigger: numeric_state
  - entity_id: binary_sensor.regenton_float_switch
    to: 'off'
    id: barrel_empty
    trigger: state
  - entity_id: binary_sensor.regenton_float_switch
    to: 'on'
    id: barrel_full
    trigger: state
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: flow_on
      - condition: state
        entity_id: binary_sensor.regenton_float_switch
        state: 'on'
      sequence:
      - target:
          entity_id: switch.regenton_solenoid_valve
        action: switch.turn_on
      - delay: 00:00:02
      - target:
          entity_id: switch.regenton_pump
        action: switch.turn_on
    - conditions:
      - condition: trigger
        id: flow_off
      sequence:
      - target:
          entity_id: switch.regenton_pump
        action: switch.turn_off
      - target:
          entity_id: switch.regenton_solenoid_valve
        action: switch.turn_off
    - conditions:
      - condition: trigger
        id: barrel_empty
      sequence:
      - target:
          entity_id: switch.regenton_pump
        action: switch.turn_off
      - target:
          entity_id: switch.regenton_solenoid_valve
        action: switch.turn_off
      - action: notify.YOUR_NOTIFY_TARGET
        data:
          title: 🪣 Regenton empty
          message: The rain barrel is empty. Pump and valve have been turned off.
    - conditions:
      - condition: trigger
        id: barrel_full
      sequence:
      - action: notify.YOUR_NOTIFY_TARGET
        data:
          title: 💧 Regenton full again
          message: The rain barrel has water again.
  mode: single

- alias: Regenton keep pump and valve in sync
  description: >-
    Failsafe, one-directional: if the pump is on, the solenoid valve
    MUST also be on (= closed, it's a normally-open valve that only
    closes once it receives power). The reverse doesn't have to hold:
    valve on without the pump is normal (e.g. during the leak emergency
    scenario). The regular "Regenton" automation already uses a 2-second
    startup delay itself, so this failsafe trigger deliberately waits 3
    seconds so it doesn't mistake that for a fault.
  triggers:
  - trigger: state
    entity_id: switch.regenton_pump
    to: 'on'
    for:
      seconds: 3
  conditions:
  - condition: state
    entity_id: switch.regenton_solenoid_valve
    state: 'off'
  actions:
  - target:
      entity_id: switch.regenton_solenoid_valve
    action: switch.turn_on
  mode: single

- alias: Regenton leak emergency stop
  description: >-
    Safety: flow above 6 L/min indicates a leak. Pump off immediately,
    solenoid valve closed (normally-open valve, so powered = closed) and
    a notification. Adjust the threshold (above: 6) to whatever a normal
    flow rate is for your setup. The condition makes sure this only
    fires once per leak (only fires again once pump/valve are back in
    their normal state) instead of re-firing on every sensor update.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.regenton_water_flow
    above: 6
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: switch.regenton_pump
      state: 'on'
    - condition: state
      entity_id: switch.regenton_solenoid_valve
      state: 'off'
  actions:
  - target:
      entity_id: switch.regenton_pump
    action: switch.turn_off
  - target:
      entity_id: switch.regenton_solenoid_valve
    action: switch.turn_on
  - action: notify.YOUR_NOTIFY_TARGET
    data:
      title: 🚨 Regenton LEAK
      message: >-
        Water flow was {{ states('sensor.regenton_water_flow') }} L/min
        (>6 L/min). Pump switched off and valve closed as an emergency stop.
  mode: single

- alias: Regenton pump maximum 21 minutes on
  description: >-
    Safety: if the pump stays on continuously for more than 21 minutes
    for whatever reason, it (and the valve) is force-shut-off and you
    get a notification. Adjust the duration (for: minutes: 21) to
    whatever is realistic for your garden.
  triggers:
  - trigger: state
    entity_id: switch.regenton_pump
    to: 'on'
    for:
      minutes: 21
  conditions: []
  actions:
  - target:
      entity_id: switch.regenton_pump
    action: switch.turn_off
  - target:
      entity_id: switch.regenton_solenoid_valve
    action: switch.turn_off
  - action: notify.YOUR_NOTIFY_TARGET
    data:
      title: ⚠️ Regenton pump emergency stop
      message: Pump was on for more than 21 minutes and has been switched off automatically.
  mode: single

- alias: Regenton too hot
  description: >-
    Notification if the ESP32 enclosure goes above 70°C (e.g. from
    direct sun or a failing fan). Set 5°C above the fan's own 65°C
    on-threshold (see ./esphome/rain-barrel.yaml) so this only fires
    when the fan isn't keeping up on its own. Adjust the threshold to
    suit your own enclosure.
  triggers:
  - trigger: temperature.crossed_threshold
    target:
      entity_id: sensor.regenton_esp32_temperature
    options:
      behavior: each
      for:
        hours: 0
        minutes: 1
        seconds: 0
      threshold:
        type: above
        value:
          active_choice: number
          number: 70
          unit_of_measurement: °C
  conditions: []
  actions:
  - action: notify.YOUR_NOTIFY_TARGET
    metadata: {}
    data:
      message: >-
        Regenton ESP32 too hot: {{ states('sensor.regenton_esp32_temperature')
        }}°C
      title: Regenton ESP too hot!
  mode: single
